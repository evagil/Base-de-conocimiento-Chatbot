spring:
  datasource:
    url: jdbc:h2:mem:base_conocimiento;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    root: warn
    com.municipio.base_conocimiento: info
    org.hibernate.SQL: warn

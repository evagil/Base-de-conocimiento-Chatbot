spring:
  application:
    name: base-conocimiento
  task:
    scheduling:
      pool:
        size: 2
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/base_conocimiento}
    username: ${DB_USERNAME:base_conocimiento}
    password: ${DB_PASSWORD:base_conocimiento}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      # Evita que el contenedor escriba el upload en un temporal global antes
      # de copiarlo al directorio privado; el límite de archivo sigue en 10 MB.
      file-size-threshold: 11MB
  web:
    locale: es_AR

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  error:
    include-message: never
    include-stacktrace: never

app:
  indice:
    habilitado: ${RAG_INDEX_ENABLED:false}
    embeddings: ${RAG_EMBEDDINGS_ENABLED:false}
    tamano-fragmento: ${RAG_CHUNK_SIZE:600}
    solapamiento: ${RAG_CHUNK_OVERLAP:80}
    max-fragmentos: ${RAG_MAX_CHUNKS:128}
    max-fuentes: ${RAG_MAX_SOURCES:100}
    max-adjuntos: ${RAG_MAX_ATTACHMENTS:3}
    timeout: ${RAG_INDEX_TIMEOUT:120s}
    intervalo: ${RAG_INDEX_INTERVAL:15000}
    inicio: ${RAG_INDEX_INITIAL_DELAY:30000}
  documentos:
    habilitada: ${DOCUMENTS_ENABLED:false}
    temporales: ${DOCUMENT_TEMP_PATH:../.local/documentos-temporales}
    tesseract: ${TESSERACT_COMMAND:tesseract}
    tessdata: ${TESSERACT_DATA_PATH:}
    idiomas: ${TESSERACT_LANGUAGES:spa+eng}
    timeout: ${DOCUMENT_TIMEOUT:60s}
    max-archivo-bytes: ${DOCUMENT_MAX_FILE_SIZE:10485760}
    max-paginas: ${DOCUMENT_MAX_PAGES:10}
    max-ocr-paginas: ${DOCUMENT_MAX_OCR_PAGES:3}
    max-caracteres: ${DOCUMENT_MAX_CHARS:40000}
    max-pixeles: ${DOCUMENT_MAX_PIXELS:6000000}
    max-temporal-bytes: ${DOCUMENT_MAX_TEMP_BYTES:33554432}
    dpi: ${DOCUMENT_RENDER_DPI:120}
  ia:
    habilitada: ${IA_ENABLED:false}
    url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    modelo-conversacion: ${OLLAMA_CHAT_MODEL:granite4.2:3b}
    modelo-agente: ${OLLAMA_AGENT_MODEL:granite4.2:3b}
    modelo-multimodal: ${OLLAMA_VISION_MODEL:qwen2.5vl:3b}
    modelo-embeddings: ${OLLAMA_EMBEDDING_MODEL:embeddinggemma:300m}
    timeout: ${OLLAMA_TIMEOUT:120s}
    conexion-timeout: ${OLLAMA_CONNECT_TIMEOUT:2s}
    contexto: ${OLLAMA_CONTEXT_TOKENS:2048}
    max-prompt-chars: ${IA_MAX_PROMPT_CHARS:4000}
    max-output-tokens: ${IA_MAX_OUTPUT_TOKENS:128}
    max-batch: ${IA_MAX_EMBEDDING_BATCH:8}
    max-response-bytes: ${IA_MAX_RESPONSE_BYTES:1048576}
  security:
    jwt-secret: ${JWT_SECRET:desarrollo-local-cambiar-esta-clave-obligatoriamente}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
    initial-admin-email: ${ADMIN_INITIAL_EMAIL:admin@municipio.local}
    initial-admin-user: ${ADMIN_INITIAL_USER:admin}
    initial-admin-password: ${ADMIN_INITIAL_PASSWORD:Admin123!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    path: ${STORAGE_PATH:../storage}
    max-image-size: ${MAX_IMAGE_SIZE:10485760}
